<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Waldläufer - Forest Platformer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1a05;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
  }
  canvas {
    border: 3px solid #2a5a10;
    box-shadow: 0 0 40px rgba(60,180,30,0.3);
    display: block;
  }
  #info {
    color: #7aba40;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="c" width="900" height="520"></canvas>
<div id="info">← → Bewegen &nbsp;|&nbsp; ↑ Springen &nbsp;|&nbsp; LEERTASTE Schießen &nbsp;|&nbsp; R Neustart</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── INPUT ─────────────────────────────────────────────────────────────
const keys = {};
const GAME_KEYS = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyR']);
document.addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR' && state.over) restart();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── CONSTANTS ─────────────────────────────────────────────────────────
const GRAVITY   = 0.48;
const JUMP      = -12;
const SPEED     = 4.5;
const BULLET_V  = 11;
const MAX_ENEMIES = 7;

// ─── STATE ──────────────────────────────────────────────────────────────
let state, player, bullets, enemies, particles, spawnTimer, frameNum;

// ─── PLATFORMS ──────────────────────────────────────────────────────────
const platforms = [
  { x: 0,   y: 472, w: 900, h: 48 },   // ground
  { x: 130, y: 370, w: 130, h: 18 },
  { x: 330, y: 310, w: 160, h: 18 },
  { x: 560, y: 375, w: 140, h: 18 },
  { x: 90,  y: 258, w: 110, h: 18 },
  { x: 390, y: 210, w: 120, h: 18 },
  { x: 660, y: 268, w: 160, h: 18 },
  { x: 240, y: 155, w: 100, h: 18 },
  { x: 690, y: 165, w: 90,  h: 18 },
];

// ─── TREES (decorative) ──────────────────────────────────────────────────
const treeDefs = [
  { x:  30, h: 210, r: 0.9 }, { x: 110, h: 185, r: 1.0 },
  { x: 230, h: 220, r: 0.85},{ x: 430, h: 195, r: 1.1 },
  { x: 630, h: 215, r: 0.95},{ x: 780, h: 200, r: 1.0 },
  { x: 870, h: 175, r: 0.8 },
];

// ─── INIT ───────────────────────────────────────────────────────────────
function restart() {
  state    = { over: false, score: 0 };
  player   = { x: 80, y: 400, w: 32, h: 42, vx: 0, vy: 0,
               onGround: false, facing: 1, cooldown: 0, hp: 4,
               iframes: 0, jumpPressed: false };
  bullets  = [];
  enemies  = [];
  particles= [];
  spawnTimer = 120;
  frameNum   = 0;
  for (let i = 0; i < 4; i++) spawnEnemy();
}

function spawnEnemy() {
  const side = Math.random() < 0.5 ? -1 : 1;
  enemies.push({
    x: side === 1 ? W + 10 : -40,
    y: 400, w: 30, h: 38,
    vx: side * -(0.8 + Math.random() * 0.8),
    vy: 0, onGround: false, hp: 2,
    iframes: 0, jumpTimer: ~~(Math.random() * 80)
  });
}

// ─── COLLISION ──────────────────────────────────────────────────────────
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function resolveVsPlats(obj) {
  obj.onGround = false;
  for (const p of platforms) {
    if (!aabb(obj, p)) continue;
    const ol = (obj.x + obj.w) - p.x;
    const or_ = (p.x + p.w) - obj.x;
    const ot = (obj.y + obj.h) - p.y;
    const ob = (p.y + p.h) - obj.y;
    const mn = Math.min(ol, or_, ot, ob);
    if (mn === ot && obj.vy >= 0)   { obj.y = p.y - obj.h; obj.vy = 0; obj.onGround = true; }
    else if (mn === ob && obj.vy < 0){ obj.y = p.y + p.h; obj.vy = 0; }
    else if (mn === ol)              { obj.x = p.x - obj.w; if (obj.vx > 0) obj.vx = 0; }
    else                             { obj.x = p.x + p.w;  if (obj.vx < 0) obj.vx = 0; }
  }
}

// ─── PARTICLES ──────────────────────────────────────────────────────────
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
                     life: 25 + ~~(Math.random()*20), color });
  }
}

// ─── UPDATE ─────────────────────────────────────────────────────────────
function update() {
  if (state.over) return;
  frameNum++;

  // Player horizontal
  if (keys['ArrowLeft'])  { player.vx = -SPEED; player.facing = -1; }
  else if (keys['ArrowRight']) { player.vx =  SPEED; player.facing =  1; }
  else player.vx *= 0.75;

  // Jump (only on fresh press)
  if (keys['ArrowUp']) {
    if (!player.jumpPressed && player.onGround) {
      player.vy = JUMP;
      player.jumpPressed = true;
    }
  } else {
    player.jumpPressed = false;
  }

  // Shoot
  if (keys['Space'] && player.cooldown <= 0) {
    const bx = player.facing === 1 ? player.x + player.w + 2 : player.x - 12;
    bullets.push({ x: bx, y: player.y + 18, w: 12, h: 6,
                   vx: player.facing * BULLET_V, vy: 0, fromPlayer: true });
    player.cooldown = 18;
    burst(bx + 4, player.y + 20, '#ffe060', 4);
  }
  if (player.cooldown > 0) player.cooldown--;
  if (player.iframes > 0) player.iframes--;

  // Physics
  player.vy += GRAVITY;
  player.x  += player.vx;
  player.y  += player.vy;
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > W) player.x = W - player.w;
  if (player.y > H + 80) { state.over = true; return; }
  resolveVsPlats(player);

  // Enemies
  spawnTimer--;
  if (spawnTimer <= 0 && enemies.length < MAX_ENEMIES) {
    spawnEnemy();
    spawnTimer = 200 + ~~(Math.random() * 150);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.iframes > 0) e.iframes--;

    // Chase player
    const dx = (player.x + 16) - (e.x + 15);
    if (Math.abs(dx) > 8) e.vx += Math.sign(dx) * 0.12;
    e.vx = Math.max(-2.2, Math.min(2.2, e.vx));

    // Occasional jump
    e.jumpTimer--;
    if (e.jumpTimer <= 0) {
      if (e.onGround) e.vy = JUMP * 0.7;
      e.jumpTimer = 90 + ~~(Math.random() * 120);
    }

    e.vy += GRAVITY;
    e.x  += e.vx;
    e.y  += e.vy;
    resolveVsPlats(e);

    if (e.y > H + 100) { enemies.splice(i, 1); continue; }

    // Hurt player
    if (player.iframes <= 0 && aabb(player, e)) {
      player.hp--;
      player.iframes = 80;
      player.vy = -7;
      burst(player.x + 16, player.y + 20, '#ff4444', 10);
      if (player.hp <= 0) { state.over = true; return; }
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1); continue;
    }

    // Hit enemy
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (aabb(b, e)) {
        e.hp--;
        e.iframes = 12;
        burst(b.x, b.y, '#ff8800', 6);
        if (e.hp <= 0) {
          burst(e.x + 15, e.y + 15, '#5aff50', 14);
          enemies.splice(j, 1);
          state.score += 10;
        }
        hit = true;
        break;
      }
    }
    if (hit) { bullets.splice(i, 1); continue; }

    // Hit platform
    for (const p of platforms) {
      if (aabb(b, p)) { burst(b.x, b.y, '#aaa', 4); bullets.splice(i, 1); hit = true; break; }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── DRAW ────────────────────────────────────────────────────────────────
function drawTree(x, baseY, h, r) {
  // Trunk
  ctx.fillStyle = '#4a2a08';
  ctx.fillRect(x - 7, baseY - h * 0.45, 14, h * 0.45);
  // Shadow side
  ctx.fillStyle = '#321a04';
  ctx.fillRect(x + 1, baseY - h * 0.45, 6, h * 0.45);

  // Foliage (3 triangle layers)
  const cols = ['#1e5a0e','#27791a','#32952a'];
  const darks = ['#164008','#1d5a12','#25701e'];
  for (let i = 0; i < 3; i++) {
    const layerBase = baseY - h * 0.38 - i * h * 0.26 * r;
    const hw = (h * 0.36 * r) * (1 - i * 0.18);
    ctx.fillStyle = cols[i];
    ctx.beginPath();
    ctx.moveTo(x, layerBase - hw * 0.85);
    ctx.lineTo(x + hw, layerBase + hw * 0.5);
    ctx.lineTo(x - hw, layerBase + hw * 0.5);
    ctx.closePath();
    ctx.fill();
    // Dark right side
    ctx.fillStyle = darks[i];
    ctx.beginPath();
    ctx.moveTo(x, layerBase - hw * 0.85);
    ctx.lineTo(x + hw, layerBase + hw * 0.5);
    ctx.lineTo(x, layerBase + hw * 0.5);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPlatform(p) {
  const isGround = p.h >= 40;
  // Dirt
  ctx.fillStyle = isGround ? '#3a2008' : '#3a2008';
  ctx.fillRect(p.x, p.y + 8, p.w, p.h - 8);
  // Grass
  ctx.fillStyle = '#2e7a14';
  ctx.fillRect(p.x, p.y, p.w, 10);
  // Bright edge
  ctx.fillStyle = '#45b820';
  ctx.fillRect(p.x, p.y, p.w, 3);
  // Dark sides
  ctx.fillStyle = '#1a0a00';
  ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
  // Mossy stones
  if (!isGround) {
    ctx.fillStyle = '#2a5a10';
    for (let sx = p.x + 10; sx < p.x + p.w - 10; sx += 22) {
      ctx.fillRect(sx, p.y + 12, 14, 5);
    }
  }
}

function drawPlayer(p) {
  const x = ~~p.x, y = ~~p.y;
  const flash = p.iframes > 0 && (frameNum % 6 < 3);
  if (flash) return;

  ctx.save();
  if (p.facing === -1) {
    ctx.translate(x + p.w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + p.w / 2), 0);
  }

  // Boots
  ctx.fillStyle = '#3a2800';
  ctx.fillRect(x + 4,  y + 34, 10, 8);
  ctx.fillRect(x + 18, y + 34, 10, 8);

  // Pants
  ctx.fillStyle = '#3a5a2a';
  ctx.fillRect(x + 4, y + 24, 24, 12);

  // Jacket
  ctx.fillStyle = '#7a3a0a';
  ctx.fillRect(x + 4, y + 13, 24, 13);

  // Left arm (back)
  ctx.fillStyle = '#6a2a08';
  ctx.fillRect(x, y + 14, 6, 14);

  // Gun
  ctx.fillStyle = '#333';
  ctx.fillRect(x + 22, y + 20, 16, 5);
  ctx.fillStyle = '#555';
  ctx.fillRect(x + 28, y + 18, 10, 3);

  // Right arm (front, holding gun)
  ctx.fillStyle = '#7a3a0a';
  ctx.fillRect(x + 26, y + 14, 6, 12);

  // Neck
  ctx.fillStyle = '#e8b090';
  ctx.fillRect(x + 12, y + 9, 8, 6);

  // Head
  ctx.fillStyle = '#e8b090';
  ctx.beginPath();
  ctx.arc(x + 16, y + 9, 9, 0, Math.PI * 2);
  ctx.fill();

  // Hat brim
  ctx.fillStyle = '#2a1800';
  ctx.fillRect(x + 4, y + 3, 24, 5);
  // Hat top
  ctx.fillRect(x + 8, y - 7, 16, 12);

  // Eye
  ctx.fillStyle = '#222';
  ctx.fillRect(x + 19, y + 6, 3, 3);
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 20, y + 6, 1, 1);

  ctx.restore();
}

function drawEnemy(e) {
  const x = ~~e.x, y = ~~e.y;
  const flash = e.iframes > 0 && (frameNum % 4 < 2);

  ctx.save();
  if (flash) ctx.globalAlpha = 0.35;

  // Determine facing from velocity
  const facingLeft = e.vx < 0;
  if (facingLeft) {
    ctx.translate(x + e.w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + e.w / 2), 0);
  }

  // Feet
  ctx.fillStyle = '#2a4a08';
  ctx.fillRect(x + 3,  y + 30, 9, 8);
  ctx.fillRect(x + 18, y + 30, 9, 8);

  // Body
  ctx.fillStyle = '#4a7a20';
  ctx.fillRect(x + 3, y + 14, 24, 18);

  // Arms
  ctx.fillStyle = '#3a6a18';
  ctx.fillRect(x,      y + 14, 5, 14);
  ctx.fillRect(x + 25, y + 14, 5, 14);

  // Claws
  ctx.fillStyle = '#222';
  ctx.fillRect(x,      y + 26, 5, 3);
  ctx.fillRect(x + 25, y + 26, 5, 3);

  // Head
  ctx.fillStyle = '#5a9a28';
  ctx.beginPath();
  ctx.arc(x + 15, y + 10, 11, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  ctx.fillStyle = '#3a7a18';
  ctx.beginPath();
  ctx.moveTo(x + 5,  y + 4); ctx.lineTo(x + 1,  y - 6); ctx.lineTo(x + 10, y + 2); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 25, y + 4); ctx.lineTo(x + 29, y - 6); ctx.lineTo(x + 20, y + 2); ctx.closePath(); ctx.fill();

  // Eyes - glowing red
  ctx.fillStyle = '#ff2200';
  ctx.fillRect(x + 7,  y + 5, 5, 5);
  ctx.fillRect(x + 18, y + 5, 5, 5);
  ctx.fillStyle = '#ff6600';
  ctx.fillRect(x + 8,  y + 6, 2, 2);
  ctx.fillRect(x + 19, y + 6, 2, 2);

  // Nose
  ctx.fillStyle = '#2a5a10';
  ctx.fillRect(x + 12, y + 11, 6, 3);

  // Teeth
  ctx.fillStyle = '#eee';
  ctx.fillRect(x + 10, y + 14, 3, 4);
  ctx.fillRect(x + 17, y + 14, 3, 4);

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 10;
  // Gradient bullet
  const g = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y);
  g.addColorStop(0, '#ff8800');
  g.addColorStop(1, '#ffee00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHUD() {
  // Score box
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(8, 8, 160, 48);
  ctx.strokeStyle = '#2a6a10';
  ctx.lineWidth = 1;
  ctx.strokeRect(8, 8, 160, 48);

  ctx.fillStyle = '#aaffaa';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('PUNKTE: ' + state.score, 16, 27);

  // HP hearts
  ctx.font = '18px monospace';
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < player.hp ? '#ff3344' : '#442233';
    ctx.fillText('♥', 16 + i * 22, 50);
  }

  // Enemy counter
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(W - 150, 8, 142, 30);
  ctx.strokeStyle = '#2a6a10';
  ctx.strokeRect(W - 150, 8, 142, 30);
  ctx.fillStyle = '#ffaaaa';
  ctx.font = '12px monospace';
  ctx.fillText('FEINDE: ' + enemies.length, W - 142, 27);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#ff2222';
  ctx.font = 'bold 56px monospace';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 30);

  ctx.fillStyle = '#aaffaa';
  ctx.font = 'bold 26px monospace';
  ctx.fillText('Punkte: ' + state.score, W / 2, H / 2 + 18);

  ctx.fillStyle = '#ffffff';
  ctx.font = '18px monospace';
  ctx.fillText('[ R ]  Neustart', W / 2, H / 2 + 58);

  ctx.textAlign = 'left';
}

function draw() {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#060d02');
  sky.addColorStop(0.55, '#0d2208');
  sky.addColorStop(1, '#1a3a0a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(220,255,200,0.5)';
  // fixed star positions from frameNum=0
  for (let s = 0; s < 40; s++) {
    const sx = ((s * 137 + s * s * 17) % W);
    const sy = ((s * 89  + s * 13)     % (H * 0.45));
    const twinkle = Math.sin(frameNum * 0.03 + s) * 0.4 + 0.6;
    ctx.globalAlpha = twinkle * 0.6;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  // Moon
  ctx.save();
  ctx.fillStyle = '#e8f0c0';
  ctx.shadowColor = '#c8e090';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(W - 80, 55, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0d2208';
  ctx.beginPath();
  ctx.arc(W - 68, 48, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Background mist
  const mist = ctx.createLinearGradient(0, H * 0.55, 0, H);
  mist.addColorStop(0, 'rgba(40,100,20,0)');
  mist.addColorStop(1, 'rgba(30,80,15,0.18)');
  ctx.fillStyle = mist;
  ctx.fillRect(0, H * 0.55, W, H * 0.45);

  // Trees
  const groundY = platforms[0].y;
  for (const t of treeDefs) drawTree(t.x, groundY, t.h, t.r);

  // Platforms
  for (const p of platforms) drawPlatform(p);

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / 45;
    ctx.fillStyle = p.color;
    ctx.fillRect(~~p.x, ~~p.y, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Bullets
  for (const b of bullets) drawBullet(b);

  // Enemies
  for (const e of enemies) drawEnemy(e);

  // Player
  drawPlayer(player);

  // HUD
  drawHUD();

  if (state.over) drawGameOver();
}

// ─── LOOP ───────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

restart();
loop();
</script>
</body>
</html>
